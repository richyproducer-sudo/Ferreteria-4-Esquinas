    --line:#222530;

    --accent-bright:#7DF9FF;
    --on-accent:#050608;
    --danger:#FF1053;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; color:var(--ink); background:var(--ground);
    font-family:'Barlow', system-ui, -apple-system, sans-serif; line-height:1.5;
  }
  h1,h2,h3{ font-family:'Barlow Condensed', sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:0.01em; margin:0; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:1rem 1.6rem; border-bottom:1px solid var(--line); background:var(--surface); }
  .topbar h1{ font-size:1.3rem; }
  .badge-role{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--navy-bright); border:1px solid var(--navy-bright); border-radius:999px; padding:0.15rem 0.6rem; margin-left:0.6rem; vertical-align:middle; }
  .stat-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-bottom:1.8rem; }
  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1.2rem; cursor:pointer; transition:border-color .2s ease; }
  .stat-card:hover{ border-color:var(--navy-bright); }
  .stat-card .n{ font-family:'IBM Plex Mono', monospace; font-size:1.8rem; font-weight:700; color:var(--accent-bright); display:block; }
  .stat-card .l{ font-size:0.78rem; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.04em; }
  .search-row{ display:flex; gap:0.7rem; margin-bottom:1.2rem; flex-wrap:wrap; }
  .search-row input, .search-row select{

  }
  .search-row input{ flex:1; min-width:180px; }
  .btn{ border:1px solid var(--line); background:var(--surface-raised); color:var(--ink); padding:0.55rem 1.1rem; border-radius:8px; font-weight:600; font-size:0.9rem; transition:border-color .2s ease, background .2s ease; }
  .btn:hover{ border-color:var(--navy-bright); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .btn-primary:hover{ background:var(--accent-bright); border-color:var(--accent-bright); }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:rgba(255,16,83,0.12); }
  .btn-wa{ background:#00FF66; border-color:#00FF66; color:#052E0F; text-align:center; }
  .btn-wa:hover{ background:#7CFFB0; border-color:#7CFFB0; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .wrap{ max-width:1100px; margin:0 auto; padding:2rem 1.6rem 4rem; }

  .login-box{ position:relative; z-index:1; max-width:380px; margin:12vh auto 0; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:2rem; }
  .binary-rain{ position:fixed; inset:0; z-index:0; }
  .field{ margin-bottom:1rem; }
  .field label{ display:block; font-size:0.8rem; color:var(--ink-muted); margin-bottom:0.35rem; text-transform:uppercase; letter-spacing:0.04em; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface-hi); border:1px solid var(--line); border-radius:8px;
    padding:0.65rem 0.8rem; color:var(--ink); font-size:0.95rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--navy-bright); }
  .error-msg{ color:var(--danger); font-size:0.88rem; margin-top:0.6rem; }
  .hint{ color:var(--ink-muted); font-size:0.82rem; margin-top:0.8rem; }

  .tabs{ display:flex; gap:0.6rem; margin-bottom:1.6rem; }
  .tab-btn{ background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); padding:0.55rem 1.1rem; border-radius:8px; font-weight:600; font-size:0.9rem; }
  .tab-btn.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

  table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td{ padding:0.75rem 0.9rem; text-align:left; border-bottom:1px solid var(--line); font-size:0.88rem; }
  th{ color:var(--ink-muted); text-transform:uppercase; font-size:0.72rem; letter-spacing:0.05em; }
  tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; }

  .badge{ display:inline-block; padding:0.2rem 0.6rem; border-radius:999px; font-size:0.72rem; font-weight:700; text-transform:uppercase; }
  .badge-in{ background:rgba(57,255,20,0.16); color:#7CFF9E; }
  .badge-low{ background:rgba(255,238,0,0.16); color:#FFEE66; }
  .badge-out{ background:rgba(255,16,83,0.16); color:var(--danger); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(5,6,9,0.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:1.2rem; }
  .modal{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:1.8rem; width:100%; max-width:520px; max-height:88vh; overflow:auto; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; }
  .modal-close{ background:none; border:none; color:var(--ink-muted); font-size:1.4rem; line-height:1; }
  .form-actions{ display:flex; gap:0.7rem; justify-content:flex-end; margin-top:1.4rem; }

  .quote-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:1.2rem 1.4rem; margin-bottom:0.9rem; }
  .quote-head{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.6rem; margin-bottom:0.6rem; }
  .quote-head .name{ font-weight:700; }
  .quote-items{ font-size:0.86rem; color:var(--ink-soft); margin:0.5rem 0; }
  .quote-items div{ display:flex; justify-content:space-between; padding:0.2rem 0; }
  .quote-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:0.6rem; flex-wrap:wrap; gap:0.6rem; }

  .empty{ color:var(--ink-muted); text-align:center; padding:3rem 1rem; }
  .row-actions{ display:flex; gap:0.5rem; }
  .row-actions button{ padding:0.35rem 0.7rem; font-size:0.8rem; }

  .subtabs{ display:flex; gap:0.5rem; margin-bottom:1.2rem; }
  .subtab-btn{ background:none; border:1px solid var(--line); color:var(--ink-muted); padding:0.4rem 0.9rem; border-radius:999px; font-size:0.82rem; font-weight:600; }
  .subtab-btn.active{ background:var(--navy-bright); border-color:var(--navy-bright); color:var(--on-accent); }
  .qty-adjust{ display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap; }
  .qty-adjust input[type="number"]{ width:70px; background:var(--surface-hi); border:1px solid var(--line); border-radius:6px; color:var(--ink); padding:0.3rem 0.5rem; font-size:0.85rem; }
  .qty-adjust input[type="text"]{ width:120px; background:var(--surface-hi); border:1px solid var(--line); border-radius:6px; color:var(--ink); padding:0.3rem 0.5rem; font-size:0.85rem; }
  .badge-dispatch-pendiente{ background:rgba(255,238,0,0.16); color:#FFEE66; }
  .badge-dispatch-preparando{ background:rgba(0,229,255,0.16); color:var(--accent-bright); }
  .badge-dispatch-despachado{ background:rgba(255,110,240,0.18); color:var(--navy-bright); }
  .badge-dispatch-entregado{ background:rgba(57,255,20,0.16); color:#7CFF9E; }
  .movements-list{ font-size:0.85rem; max-height:260px; overflow:auto; }
  .movements-list div{ display:flex; justify-content:space-between; gap:0.5rem; padding:0.4rem 0; border-bottom:1px solid var(--line); }
  .movements-list div:last-child{ border-bottom:none; }

  .qr-box{ display:flex; justify-content:center; padding:1rem; background:#fff; border-radius:10px; margin:0.8rem 0; }
  #scannerRegion{ width:100%; border-radius:10px; overflow:hidden; }
  .scan-manual{ display:flex; gap:0.5rem; margin-top:1rem; }
  .scan-manual input{ flex:1; background:var(--surface-hi); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:0.6rem 0.8rem; }
  .delivery-code-display{
    font-family:'IBM Plex Mono', monospace; font-size:2rem; letter-spacing:0.2em; text-align:center;
    color:var(--accent-bright); background:var(--surface-hi); border:1px solid var(--line); border-radius:10px;
    padding:1rem; margin:1rem 0;
  }
  .badge-dispatch-pill{ display:inline-block; margin-left:0.5rem; }
  .scan-feedback{
    display:flex; flex-direction:column; align-items:center; gap:0.9rem; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:2.2rem 2.6rem; animation:scanFeedbackPop 0.25s ease-out;
  }
  .scan-feedback-check{
    width:84px; height:84px; border-radius:50%; background:#16a34a; color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 8px rgba(22,163,74,0.18);
  }
  .scan-feedback-msg{ font-size:1.05rem; font-weight:700; color:var(--ink); text-align:center; }
  @keyframes scanFeedbackPop{ 0%{ transform:scale(0.85); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .photo-capture-preview{ width:100%; max-width:220px; border-radius:8px; border:1px solid var(--line); margin-top:0.5rem; display:block; }
  .delivery-log-card{ display:flex; gap:0.9rem; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0.9rem 1rem; margin-bottom:0.8rem; }
  .delivery-log-thumb{ width:64px; height:64px; border-radius:8px; object-fit:cover; border:1px solid var(--line); flex:none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  "use strict";
  var e = React.createElement;

  // Pon aqui la URL de tu backend en Render una vez desplegado (ver backend/README.md).
  var API_BASE = "https://ferreteria-4-esquinas-backend.onrender.com";

  var TOKEN_KEY = 'f4e_admin_token_v1';
  var CATEGORY_OPTIONS = ['pinturas','herramientas','plomeria','electricos','seguridad','cerrajeria','general'];
  var ICON_OPTIONS = ['pintura','herramienta','plomeria','electrico','seguridad','cerrajeria'];

  function money(n){ return "$ " + Math.round(Number(n) || 0).toLocaleString('es-CO') + " COP"; }

  function apiFetch(path, token, options){
    options = options || {};
    var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if (token) headers.Authorization = 'Bearer ' + token;
    return fetch(API_BASE + path, Object.assign({}, options, { headers: headers }))
      .then(function(res){
        return res.json().then(function(data){
          if (!res.ok || data.ok === false) throw new Error(data.error || 'Error de red.');
          return data;
        });
      });
  }

  // Puramente decorativo (no es seguridad real: cualquiera puede ver el codigo fuente
  // de esta pagina igual). Anima columnas de 0/1 cayendo detras del formulario de login,
  // estilo "lluvia digital".
  function BinaryRain(){
    var canvasRef = React.useRef(null);
    React.useEffect(function(){
      var canvas = canvasRef.current;
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var fontSize = 16;
      var columns, drops;

      function resize(){
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.ceil(canvas.width / fontSize);
        drops = new Array(columns).fill(0).map(function(){ return Math.random() * canvas.height / fontSize; });
      }
      resize();
      window.addEventListener('resize', resize);

      ctx.font = fontSize + 'px "IBM Plex Mono", monospace';
      var frame = setInterval(function(){
        ctx.fillStyle = 'rgba(7,8,11,0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0,229,255,0.55)';
        for (var i = 0; i < columns; i++){
          var glyph = Math.random() > 0.5 ? '1' : '0';
          ctx.fillText(glyph, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
      }, 60);

      return function(){ clearInterval(frame); window.removeEventListener('resize', resize); };
    }, []);
    return e('canvas', { ref: canvasRef, className: 'binary-rain', 'aria-hidden': 'true' });
  }

  function LoginScreen(props){
    var _e = React.useState(''); var email = _e[0], setEmail = _e[1];
    var _p = React.useState(''); var password = _p[0], setPassword = _p[1];
    var _err = React.useState(''); var err = _err[0], setErr = _err[1];
    var _loading = React.useState(false); var loading = _loading[0], setLoading = _loading[1];

    function submit(ev){
      ev.preventDefault();
      if (!API_BASE) {
        setErr('Este panel aun no esta conectado a un backend. Sigue backend/README.md para desplegarlo y luego pon su URL en admin.html (API_BASE).');
        return;
      }
      setLoading(true); setErr('');
      apiFetch('/api/auth/login', null, { method:'POST', body: JSON.stringify({ email:email, password:password }) })
        .then(function(data){
          if (data.user.role !== 'admin' && data.user.role !== 'superadmin') { throw new Error('Esta cuenta no tiene permisos de administrador.'); }
          props.onLogin(data.token, data.user);
        })
        .catch(function(e){ setErr(e.message); })
        .finally(function(){ setLoading(false); });
    }

    return e(React.Fragment, null,
      e(BinaryRain, null),
      e('div', { className:'login-box' },
      e('h1', { style:{ marginBottom:'1.4rem', fontSize:'1.4rem' } }, 'Panel de administrador'),
      e('form', { onSubmit: submit },
        e('div', { className:'field' },
          e('label', null, 'Correo'),
          e('input', { type:'email', required:true, value:email, onChange:function(ev){ setEmail(ev.target.value); } })
        ),
        e('div', { className:'field' },
          e('label', null, 'Contraseña'),
          e('input', { type:'password', required:true, value:password, onChange:function(ev){ setPassword(ev.target.value); } })
        ),
        err ? e('div', { className:'error-msg' }, err) : null,
        e('button', { type:'submit', className:'btn btn-primary', style:{ width:'100%', marginTop:'0.6rem' }, disabled:loading }, loading ? 'Entrando…' : 'Entrar')
      ),
      e('p', { className:'hint' }, 'Este panel es solo para el administrador de la ferretería. El usuario se crea desde el backend con "npm run seed:admin".')
      )
    );
  }

  function StockBadge(props){
    var map = { in:['badge-in','Disponible'], low:['badge-low','Poco stock'], out:['badge-out','Agotado'] };
    var v = map[props.status] || map.in;
    return e('span', { className:'badge ' + v[0] }, v[1]);
  }

  function emptyForm(){
    return { name:'', category:'herramientas', unit:'unidad', price:'', description:'', image_url:'', icon:'herramienta', stock_status:'in' };
  }

  // Reduce cualquier foto a un tamaño razonable (max 1000px de lado, JPEG ~82% calidad)
  // antes de guardarla como data URI en base64, para que la base de datos no se llene
  // de fotos pesadas sin comprimir.
  function resizeImageFile(file){
    return new Promise(function(resolve, reject){
      if (!file.type || file.type.indexOf('image/') !== 0) { reject(new Error('El archivo debe ser una imagen.')); return; }
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('No se pudo leer el archivo.')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('No se pudo leer la imagen.')); };
        img.onload = function(){
          var maxDim = 1000;
          var w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
          }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function ProductForm(props){
    var _f = React.useState(props.product ? Object.assign({}, props.product) : emptyForm());
    var form = _f[0], setForm = _f[1];
    var _err = React.useState(''); var err = _err[0], setErr = _err[1];
    var _saving = React.useState(false); var saving = _saving[0], setSaving = _saving[1];
    var _imgMode = React.useState(props.product && props.product.image_url && props.product.image_url.indexOf('data:') === 0 ? 'upload' : 'url');
    var imgMode = _imgMode[0], setImgMode = _imgMode[1];
    var _imgBusy = React.useState(false); var imgBusy = _imgBusy[0], setImgBusy = _imgBusy[1];
    var _imgErr = React.useState(''); var imgErr = _imgErr[0], setImgErr = _imgErr[1];

    function set(key){ return function(ev){ setForm(Object.assign({}, form, { [key]: ev.target.value })); }; }

    function onFileChange(ev){
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      setImgBusy(true); setImgErr('');
      resizeImageFile(file)
        .then(function(dataUri){ setForm(function(prev){ return Object.assign({}, prev, { image_url: dataUri }); }); })
        .catch(function(e){ setImgErr(e.message); })
        .finally(function(){ setImgBusy(false); });
    }

    function submit(ev){
      ev.preventDefault();
      if (!form.name.trim() || !form.price) { setErr('Nombre y precio son obligatorios.'); return; }
      if (imgBusy) { setErr('Espera a que termine de procesarse la imagen.'); return; }
      setSaving(true); setErr('');
      var payload = Object.assign({}, form, { price: Number(form.price) });
      var isEdit = Boolean(props.product && props.product.id);
      var path = isEdit ? '/api/products/' + props.product.id : '/api/products';
      apiFetch(path, props.token, { method: isEdit ? 'PUT' : 'POST', body: JSON.stringify(payload) })
        .then(function(){ props.onSaved(); })
        .catch(function(e){ setErr(e.message); })
        .finally(function(){ setSaving(false); });
    }

    return e('div', { className:'modal-overlay', onClick:function(ev){ if (ev.target === ev.currentTarget) props.onClose(); } },
      e('div', { className:'modal' },
        e('div', { className:'modal-head' },
          e('h2', { style:{ fontSize:'1.15rem' } }, props.product ? 'Editar producto' : 'Nuevo producto'),
          e('button', { className:'modal-close', onClick:props.onClose }, '×')
        ),
        e('form', { onSubmit: submit },
          e('div', { className:'field' }, e('label', null, 'Nombre'), e('input', { value:form.name, onChange:set('name'), required:true })),
          e('div', { className:'field' }, e('label', null, 'Categoría'),
            e('select', { value:form.category, onChange:set('category') },
              CATEGORY_OPTIONS.map(function(c){ return e('option', { key:c, value:c }, c); })
            )
          ),
          e('div', { className:'field' }, e('label', null, 'Unidad (ej. unidad, galón, par)'), e('input', { value:form.unit, onChange:set('unit') })),
          e('div', { className:'field' }, e('label', null, 'Precio (COP)'), e('input', { type:'number', min:'0', value:form.price, onChange:set('price'), required:true })),
          e('div', { className:'field' }, e('label', null, 'Descripción'), e('textarea', { rows:3, value:form.description, onChange:set('description') })),
          e('div', { className:'field' },
            e('label', null, 'Foto del producto'),
            e('div', { style:{ display:'flex', gap:'0.5rem', marginBottom:'0.6rem' } },
              e('button', { type:'button', className:'btn' + (imgMode === 'url' ? ' btn-primary' : ''), onClick:function(){ setImgMode('url'); setImgErr(''); } }, 'Por URL'),
              e('button', { type:'button', className:'btn' + (imgMode === 'upload' ? ' btn-primary' : ''), onClick:function(){ setImgMode('upload'); setImgErr(''); } }, 'Subir imagen')
            ),
            imgMode === 'url'
              ? e('input', { value:form.image_url, onChange:set('image_url'), placeholder:'https://...' })
              : e('input', { type:'file', accept:'image/*', onChange:onFileChange }),
            imgBusy ? e('p', { className:'hint' }, 'Procesando imagen…') : null,
            imgErr ? e('div', { className:'error-msg' }, imgErr) : null,
            form.image_url ? e('img', { src:form.image_url, alt:'Vista previa', style:{ maxWidth:'140px', maxHeight:'140px', borderRadius:'8px', marginTop:'0.7rem', display:'block', objectFit:'cover', border:'1px solid var(--line)' } }) : null
          ),
          e('div', { className:'field' }, e('label', null, 'Ícono'),
            e('select', { value:form.icon, onChange:set('icon') },
              ICON_OPTIONS.map(function(i){ return e('option', { key:i, value:i }, i); })
            )
          ),
          e('div', { className:'field' }, e('label', null, 'Disponibilidad'),
            e('select', { value:form.stock_status, onChange:set('stock_status') },
              e('option', { value:'in' }, 'Disponible'),
              e('option', { value:'low' }, 'Poco stock'),
              e('option', { value:'out' }, 'Agotado')
            )
          ),
          err ? e('div', { className:'error-msg' }, err) : null,
          e('div', { className:'form-actions' },
            e('button', { type:'button', className:'btn', onClick:props.onClose }, 'Cancelar'),
            e('button', { type:'submit', className:'btn btn-primary', disabled:saving || imgBusy }, saving ? 'Guardando…' : 'Guardar')
          )
        )
      )
    );
  }

  function ProductsTab(props){

  // guardarla en localStorage (el storage del navegador es limitado).
  function resizeImageFile(file, maxW){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(){
        var img = new Image();
        img.onerror = reject;
        img.onload = function(){
          var scale = Math.min(1, maxW / img.width);
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function DespachosView(props){
    var _quotes = React.useState([]); var quotes = _quotes[0], setQuotes = _quotes[1];
    var _loading = React.useState(true); var loading = _loading[0], setLoading = _loading[1];
    var _err = React.useState(''); var err = _err[0], setErr = _err[1];
    var _scannerOpen = React.useState(false); var scannerOpen = _scannerOpen[0], setScannerOpen = _scannerOpen[1];
    var _qrQuote = React.useState(null); var qrQuote = _qrQuote[0], setQrQuote = _qrQuote[1];
    var _finishQuote = React.useState(null); var finishQuote = _finishQuote[0], setFinishQuote = _finishQuote[1];
    var _finishPrefillCode = React.useState(null); var finishPrefillCode = _finishPrefillCode[0], setFinishPrefillCode = _finishPrefillCode[1];
    var _deliveryResult = React.useState(null); var deliveryResult = _deliveryResult[0], setDeliveryResult = _deliveryResult[1];
    var _feedback = React.useState(null); var feedback = _feedback[0], setFeedback = _feedback[1];
    var _dismissed = React.useState(loadDismissedDispatches()); var dismissed = _dismissed[0], setDismissed = _dismissed[1];

    function dismiss(q){
      if (!window.confirm('¿Quitar el pedido #' + q.id + ' — ' + q.customer_name + ' de esta lista? Ya no aparecerá aquí, pero el registro se conserva en el sistema.')) return;
      dismissDispatch(q.id);
      setDismissed(loadDismissedDispatches());
    }

    function load(){
      setLoading(true);
      apiFetch('/api/quotes', props.token)
        .then(function(data){ setQuotes(data.quotes.filter(function(q){ return q.status === 'confirmada'; })); setErr(''); })
        .catch(function(e){ setErr(e.message); })
        .finally(function(){ setLoading(false); });
    }
    React.useEffect(load, []);

    function changePrepStatus(q, status){
      apiFetch('/api/quotes/' + q.id + '/dispatch-status', props.token, { method:'PUT', body: JSON.stringify({ dispatch_status: status }) })
        .then(load)
        .catch(function(e){ setErr(e.message); });
    }

    function startDelivery(q){
      setErr('');
      apiFetch('/api/quotes/' + q.id + '/start-delivery', props.token, { method:'POST' })
        .then(function(data){
          saveDispatchCode(q.id, data.delivery_code);
          setDeliveryResult({ quote: data.quote, code: data.delivery_code });
          load();
        })
        .catch(function(e){ setErr(e.message); });
    }

    // Si llegamos aqui porque se acaba de confirmar un pedido en Cotizaciones o
    // Cobro, arrancamos su entrega automaticamente en cuanto aparezca en esta
    // lista (misma señal de chulo verde + pitido que al escanear).
    var autoStartHandledRef = React.useRef(null);
    React.useEffect(function(){
      if (!props.autoStartQuoteId || loading) return;
      if (autoStartHandledRef.current === props.autoStartQuoteId) return;
      var q = quotes.find(function(x){ return x.id === props.autoStartQuoteId; });
      if (!q) { props.onConsumedAutoStart(); return; }
      autoStartHandledRef.current = props.autoStartQuoteId;
      if (q.dispatch_status === 'pendiente' || q.dispatch_status === 'preparando') {
        setFeedback({ message: 'Iniciando entrega para ' + q.customer_name, next: function(){ startDelivery(q); } });
      }
      props.onConsumedAutoStart();
    }, [props.autoStartQuoteId, loading, quotes]);

    function handleScanned(text){
      setScannerOpen(false);
      // Primero revisa si es el QR de finalizar entrega (trae el codigo de
      // seguridad real incluido) que el cliente muestra desde su WhatsApp —
      // en ese caso se abre el formulario ya con el codigo verificado.
      var finish = parseFinishQrText(text);
      if (finish) {
        var fq = quotes.find(function(x){ return x.id === finish.quoteId; });
        if (!fq) { setErr('No se encontró ningún pedido confirmado con ese número (#' + finish.quoteId + ').'); return; }
        if (fq.dispatch_status !== 'despachado') { setErr('El pedido de ' + fq.customer_name + ' no está en camino todavía.'); return; }
        setErr('');
        setFinishPrefillCode(finish.code);
        setFinishQuote(fq);
        return;
      }
      var id = parseOrderCode(text);
      var q = quotes.find(function(x){ return x.id === id; });
      if (!q) { setErr('No se encontró ningún pedido confirmado con ese número (#' + (id || text) + ').'); return; }
      setErr('');
      if (q.dispatch_status === 'pendiente' || q.dispatch_status === 'preparando') {
        // Escanear YA es la confirmacion — chulo verde inmediato y se inicia la
        // entrega automaticamente al cerrar el aviso.
        setFeedback({ message: 'Iniciando entrega para ' + q.customer_name, next: function(){ startDelivery(q); } });
      } else if (q.dispatch_status === 'despachado') {
        setFinishPrefillCode(null);
        setFinishQuote(q);
      } else {
        setErr('El pedido de ' + q.customer_name + ' ya fue entregado.');
      }
    }

    var visibleQuotes = quotes.filter(function(q){ return dismissed.indexOf(q.id) === -1; });
    var hiddenCount = quotes.length - visibleQuotes.length;

    return e('div', null,
      e('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1rem', flexWrap:'wrap', gap:'0.6rem' } },
        e('p', { className:'hint', style:{ margin:0 } },
          'Solo se muestran las cotizaciones ya confirmadas por el cliente.' +
          (hiddenCount > 0 ? ' (' + hiddenCount + ' entregado' + (hiddenCount === 1 ? '' : 's') + ' eliminado' + (hiddenCount === 1 ? '' : 's') + ' de esta lista.)' : '')),
        e('button', { className:'btn btn-primary', onClick:function(){ setErr(''); setScannerOpen(true); } }, '📷 Escanear pedido')
      ),
      err ? e('div', { className:'error-msg', style:{ marginBottom:'1rem' } }, err) : null,
      loading ? e('p', { className:'hint' }, 'Cargando…') :
      visibleQuotes.length === 0 ? e('div', { className:'empty' }, 'No hay pedidos confirmados pendientes de despacho.') :
      visibleQuotes.map(function(q){
        return e('div', { key:q.id, className:'quote-card' },
          e('div', { className:'quote-head' },
            e('div', null,
              e('span', { className:'name' }, '#' + q.id + ' — ' + q.customer_name), ' — ', e('span', { className:'mono' }, q.customer_phone),
              e('span', { className:'badge badge-dispatch-' + q.dispatch_status + ' badge-dispatch-pill' }, DISPATCH_LABELS[q.dispatch_status])
            ),
            e('span', { className:'hint' }, new Date(q.created_at).toLocaleString('es-CO'))
          ),
          e('div', { className:'quote-items' }, q.items.map(function(it){
            return e('div', { key:it.id }, e('span', null, it.qty + '× ' + it.product_name), e('span', { className:'mono' }, money(it.unit_price * it.qty)));
          })),
          e('div', { className:'quote-foot' },
            e('span', { className:'mono', style:{ fontWeight:700 } }, 'Total: ' + money(q.subtotal)),
            q.dispatch_updated_at ? e('span', { className:'hint' }, 'Actualizado: ' + new Date(q.dispatch_updated_at).toLocaleString('es-CO')) : null,
            e('div', { className:'row-actions' },
              e('button', { className:'btn', onClick:function(){ setQrQuote(q); } }, 'Ver QR'),
              (q.dispatch_status === 'pendiente' || q.dispatch_status === 'preparando') && e('select', {
                className:'mono', value:q.dispatch_status, onChange:function(ev){ changePrepStatus(q, ev.target.value); },
                style:{ background:'var(--surface-hi)', color:'var(--ink)', border:'1px solid var(--line)', borderRadius:'6px', padding:'0.3rem 0.5rem' }
              },
                e('option', { value:'pendiente' }, 'Pendiente'),
                e('option', { value:'preparando' }, 'Preparando')
              ),
              (q.dispatch_status === 'pendiente' || q.dispatch_status === 'preparando') && e('button', { className:'btn btn-primary', onClick:function(){ startDelivery(q); } }, 'Iniciar entrega'),
              q.dispatch_status === 'despachado' && e('button', {
                className:'btn btn-primary', onClick:function(){ setFinishPrefillCode(null); setFinishQuote(q); }
              }, 'Finalizar entrega'),
              q.dispatch_status === 'entregado' && e('button', {

      }),
      scannerOpen ? e(ScannerModal, { onScanned:handleScanned, onClose:function(){ setScannerOpen(false); } }) : null,
      qrQuote ? e(QrModal, { quote:qrQuote, onClose:function(){ setQrQuote(null); } }) : null,
      finishQuote ? e(FinishDeliveryModal, {
        token:props.token, quote:finishQuote, prefillCode:finishPrefillCode,
        onClose:function(){ setFinishQuote(null); setFinishPrefillCode(null); },
        onDone:function(){
          var q = finishQuote;
          setFinishQuote(null);
          setFinishPrefillCode(null);
          setFeedback({ message: '¡Finalizaste la entrega de ' + q.customer_name + '!', next: load });
        }
      }) : null,
      deliveryResult ? e(DeliveryCodeModal, { quote:deliveryResult.quote, code:deliveryResult.code, onClose:function(){ setDeliveryResult(null); } }) : null,
      feedback ? e(ScanFeedback, {
        message:feedback.message,
        onDone:function(){ var next = feedback.next; setFeedback(null); if (next) next(); }
      }) : null
    );
  }

    var _sub = React.useState('despacho'); var sub = _sub[0], setSub = _sub[1];

      }) :

  function readSavedAuth(){
    try {
      var raw = localStorage.getItem(TOKEN_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (parsed && parsed.token && parsed.user) return parsed;
      return null;
    } catch(e){ return null; }
  }

  function AdminApp(){
    var _auth = React.useState(readSavedAuth());
    var auth = _auth[0], setAuth = _auth[1];
    var _tab = React.useState('dashboard'); var tab = _tab[0], setTab = _tab[1];
    // Cuando se registra el pago (efectivo/Wompi) en Cobro, saltamos directo a

    var _autoStart = React.useState(null); var autoStartQuoteId = _autoStart[0], setAutoStartQuoteId = _autoStart[1];
    function goConfirmAndDispatch(quoteId){
      setAutoStartQuoteId(quoteId);
      setTab('dispatch');
    }
    // Cuando solo se marca "Confirmada" en Cotizaciones (todavia no se cobro),
    // saltamos a Cobro con ese pedido ya buscado, para cobrarlo enseguida.
    var _autoSearch = React.useState(null); var autoSearchQuoteId = _autoSearch[0], setAutoSearchQuoteId = _autoSearch[1];
    function goConfirmAndPay(quoteId){
      setAutoSearchQuoteId(quoteId);
      setTab('payment');
    }

    function onLogin(newToken, newUser){
      var record = { token: newToken, user: newUser };
      try { localStorage.setItem(TOKEN_KEY, JSON.stringify(record)); } catch(e){}
      setAuth(record);
    }
    function logout(){
      try { localStorage.removeItem(TOKEN_KEY); } catch(e){}

    }

    }

    React.useEffect(function(){
      if (allowedTabs.indexOf(tab) === -1 && tab !== 'staff') setTab(allowedTabs[0] || 'dashboard');
    }, [user && user.job_title, user && user.role]);

    return e('div', null,
      e('div', { className:'topbar' },
        e('h1', null,
          'Ferretería 4 Esquinas · Admin',
          isSuperAdmin ? e('span', { className:'badge-role' }, 'Super Admin') : (user && user.job_title ? e('span', { className:'badge-role' }, user.job_title) : null)
        ),
        e('button', { className:'btn', onClick:logout }, 'Cerrar sesión')
      ),
      e('div', { className:'wrap' },
        e('div', { className:'tabs' },
          ALL_ADMIN_TABS.filter(function(t){ return allowedTabs.indexOf(t) !== -1; }).map(function(t){

        ),
        tab === 'dashboard' && allowedTabs.indexOf('dashboard') !== -1 ? e(DashboardTab, { token:token, isSuperAdmin:isSuperAdmin, onNavigate:setTab }) :

  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(AdminApp));
})();
